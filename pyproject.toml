[project]
name = "vaani-knowledge-platform"
version = "1.0.0"
description = "Enterprise AI Knowledge Platform — Multi-tenant RAG with streaming chat, RBAC, and multi-provider LLM support"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "sse-starlette>=2.1.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    # Auth / Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",
    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",
    # HTTP client
    "httpx>=0.27.0",
    # Vector DB
    # Embeddings
    "tiktoken>=0.7.0",
    # LLM providers
    "openai>=2.41.1",
    "google-genai>=0.1.2",
    "groq>=0.9.0",
    # Document parsing
    "pypdf>=4.3.0",
    "camelot-py>=0.11.0",
    "opencv-python>=4.8.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "markdown>=3.6",
    # Utilities
    "python-dotenv>=1.2.2",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "tabulate>=0.9.0",
    "psycopg[binary]>=3.3.4",
    "pgvector>=0.4.2",
    "huggingface-hub>=1.21.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src"]
