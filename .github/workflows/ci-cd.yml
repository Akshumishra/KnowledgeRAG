name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION:  ${{ vars.PYTHON_VERSION || '3.11' }}
  REGISTRY:        ${{ vars.ACR_REGISTRY || 'ghcr.io' }}
  IMAGE_NAME:      ${{ vars.IMAGE_NAME || 'knowledgerag' }}
  APP_NAME:        ${{ vars.AZURE_APP_NAME || 'knowledgerag' }}
  RESOURCE_GROUP:  ${{ vars.AZURE_RESOURCE_GROUP || 'rg-knowledgerag' }}
  ACR_NAME:        ${{ vars.ACR_NAME || 'crknowledgerag' }}
  LIVE_URL:        ${{ vars.LIVE_URL || 'http://localhost' }}
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      APP_ENV:        testing
      DATABASE_URL:   "sqlite+aiosqlite:///:memory:"
      SECRET_KEY:     ${{ secrets.TEST_SECRET_KEY || 'ci-test-secret-key' }}
      ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY || '' }}
      PYTHONPATH:     ${{ github.workspace }}/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install uv
        run: pip install --quiet uv

      - name: Install dependencies (including dev extras)
        run: uv pip install --system ".[dev]" ruff

      - name: Lint with Ruff
        run: ruff check backend/src/ --output-format=github

      - name: Run tests with Pytest
        run: |
          python -m pytest backend/tests/ \
            --cov=src \
            --cov-report=xml:backend/coverage.xml \
            --cov-report=term-missing \
            --import-mode=importlib \
            --tb=short \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 7
  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      actions: read
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pipx install semgrep

      - name: Run Semgrep
        run: semgrep scan --config="p/python" --config="p/fastapi" --config="p/owasp-top-ten" --sarif --output=semgrep.sarif || true

      - name: Upload Semgrep SARIF as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep.sarif
          retention-days: 7

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: sast-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build Docker image (cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export image to tarball
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o /tmp/image.tar

      - name: Upload image tarball as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/image.tar

      - name: Trivy scan — table output (informational)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Trivy scan — SARIF output
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 7

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: container-scan
    environment:
      name: production
      url: ${{ env.LIVE_URL }}

    steps:
      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/image.tar

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Tag and push image to ACR
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}

          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          echo "Pushed sha-${SHORT_SHA} and :latest to ACR"

      - name: Configure Azure App Service settings
        run: |
          az webapp config appsettings set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.APP_NAME }} \
            --settings \
              APP_ENV=production \
              LOG_LEVEL=INFO \
              WEBSITES_PORT=8000 \
              DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}" \
              SECRET_KEY="${{ secrets.PROD_SECRET_KEY }}" \
              ENCRYPTION_KEY="${{ secrets.PROD_ENCRYPTION_KEY }}" \
              JWT_ALGORITHM=HS256 \
              ACCESS_TOKEN_EXPIRE_MINUTES=60 \
              REFRESH_TOKEN_EXPIRE_DAYS=7 \
              SMTP_HOST="${{ secrets.SMTP_HOST }}" \
              SMTP_PORT="${{ secrets.SMTP_PORT }}" \
              SMTP_USER="${{ secrets.SMTP_USER }}" \
              SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" \
              SMTP_FROM_EMAIL="${{ secrets.SMTP_FROM_EMAIL }}" \
              SMTP_USE_TLS=true \
              OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              IMAGE_OPEN_API_KEY="${{ secrets.IMAGE_OPEN_API_KEY }}" \
              IMAGE_PROCESSING_MODEL="${{ secrets.IMAGE_PROCESSING_MODEL }}" \
              HF_TOKEN="${{ secrets.HF_TOKEN }}" \
              EMBEDDING_MODEL="${{ vars.EMBEDDING_MODEL }}" \
              MAX_UPLOAD_SIZE_MB="${{ vars.MAX_UPLOAD_SIZE_MB }}" \
              UPLOAD_DIR=uploads \
              ALLOWED_ORIGINS="${{ vars.ALLOWED_ORIGINS }}"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          images: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest'

      - name: Smoke test — verify live health endpoint
        run: |
          echo "Waiting for App Service to start (up to 5 min)..."
          MAX_RETRIES=20
          SLEEP_SECONDS=15
          HEALTH_URL="${{ env.LIVE_URL }}/api/v1/health"

          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 --max-time 20 "$HEALTH_URL" || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed (HTTP $HTTP_STATUS) on attempt $i"
              exit 0
            else
              echo "  Attempt $i/$MAX_RETRIES — HTTP $HTTP_STATUS, retrying in ${SLEEP_SECONDS}s..."
              sleep $SLEEP_SECONDS
            fi
          done

          echo "Smoke test FAILED — $HEALTH_URL did not return 200 after $MAX_RETRIES attempts"
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "## Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Live URL** | ${{ env.LIVE_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | sha-${SHORT_SHA} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
