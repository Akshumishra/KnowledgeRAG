# ─────────────────────────────────────────────────────────────────────────────
# KnowledgeRAG — GitHub Actions CI/CD Pipeline
#
# Stages:
#   1. test           — Install deps (uv), lint (ruff), pytest + coverage
#   2. sast-scan      — Semgrep SAST → SARIF → GitHub Security tab
#   3. build          — Docker build with GHA layer cache → exports image digest
#   4. container-scan — Trivy image scan → SARIF → GitHub Security tab
#   5. deploy         — Push to ACR, deploy to Azure App Service, smoke test
#
# All configuration is read from GitHub Secrets / Variables — nothing is
# hardcoded. See the repository README or walkthrough for the full list.
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Shared variables (non-sensitive — stored as GitHub Variables) ─────────────
# These are read from the repository's "Variables" tab (not Secrets).
# Set them at: Settings → Secrets and variables → Actions → Variables
env:
  PYTHON_VERSION:  ${{ vars.PYTHON_VERSION }}
  REGISTRY:        ${{ vars.ACR_REGISTRY }}
  IMAGE_NAME:      ${{ vars.IMAGE_NAME }}
  APP_NAME:        ${{ vars.AZURE_APP_NAME }}
  RESOURCE_GROUP:  ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_NAME:        ${{ vars.ACR_NAME }}
  LIVE_URL:        ${{ vars.LIVE_URL }}

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — TEST
# Runs on every push and PR. Blocks all downstream jobs on failure.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Cache uv's package downloads for faster installs
      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install uv
        run: pip install --quiet uv

      - name: Install dependencies (including dev extras)
        run: uv pip install --system --extra dev .

      # ── Lint ────────────────────────────────────────────────────────────────
      - name: Lint with Ruff
        run: |
          uv pip install --system ruff
          ruff check backend/src/ --output-format=github

      # ── Tests ───────────────────────────────────────────────────────────────
      # Sensitive values come from GitHub Secrets; app is run in testing mode
      # which uses an in-memory SQLite DB — no real database needed.
      - name: Run tests with Pytest
        env:
          APP_ENV:        testing
          DATABASE_URL:   ${{ secrets.TEST_DATABASE_URL }}
          SECRET_KEY:     ${{ secrets.TEST_SECRET_KEY }}
          ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY }}
        run: |
          cd backend
          python -m pytest tests/ \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --tb=short \
            -v

      # ── Upload coverage so it is visible in PR summaries ───────────────────
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — SAST SCAN (Semgrep)
# Static Application Security Testing.
# Results appear in GitHub → Security → Code Scanning.
# ─────────────────────────────────────────────────────────────────────────────
  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      security-events: write   # required to upload SARIF
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/fastapi
            p/owasp-top-ten
          generateSarif: "1"
        env:
          SEMGREP_RULES: >-
            p/python
            p/fastapi
            p/owasp-top-ten

      - name: Upload Semgrep SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — BUILD
# Builds the Docker image using GitHub Actions layer cache.
# Only runs on push to main (not PRs) to avoid wasting build minutes.
# Exports the image to a tarball so downstream jobs reuse it.
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: sast-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build Docker image (cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export image to tarball
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o /tmp/image.tar

      - name: Upload image tarball as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — CONTAINER VULNERABILITY SCAN (Trivy)
# Scans the built image for OS + library CVEs.
# Fails the pipeline on any CRITICAL or HIGH severity finding.
# Results also appear in GitHub → Security → Code Scanning.
# ─────────────────────────────────────────────────────────────────────────────
  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/image.tar

      # Table output for quick human review in the job log
      - name: Trivy scan — table output (informational)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'

      # SARIF output for GitHub Security tab — blocks on CRITICAL/HIGH
      - name: Trivy scan — SARIF output
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

# ─────────────────────────────────────────────────────────────────────────────
# JOB 5 — DEPLOY
# Pushes the scanned image to Azure Container Registry and deploys to the
# existing Azure App Service. A smoke test confirms the live URL is healthy.
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: container-scan
    environment:
      name: production
      url: ${{ env.LIVE_URL }}

    steps:
      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/image.tar

      # ── Azure Login ─────────────────────────────────────────────────────────
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Push to ACR ─────────────────────────────────────────────────────────
      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Tag and push image to ACR
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}

          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          echo "Pushed sha-${SHORT_SHA} and :latest to ACR"

      # ── Sync App Settings to Azure App Service ─────────────────────────────
      # This updates all runtime environment variables on the App Service
      # so the application always starts with the correct configuration.
      # All values come from GitHub Secrets — nothing is hardcoded.
      - name: Configure Azure App Service settings
        run: |
          az webapp config appsettings set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.APP_NAME }} \
            --settings \
              APP_ENV=production \
              LOG_LEVEL=INFO \
              WEBSITES_PORT=8000 \
              DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}" \
              SECRET_KEY="${{ secrets.PROD_SECRET_KEY }}" \
              ENCRYPTION_KEY="${{ secrets.PROD_ENCRYPTION_KEY }}" \
              JWT_ALGORITHM=HS256 \
              ACCESS_TOKEN_EXPIRE_MINUTES=60 \
              REFRESH_TOKEN_EXPIRE_DAYS=7 \
              SMTP_HOST="${{ secrets.SMTP_HOST }}" \
              SMTP_PORT="${{ secrets.SMTP_PORT }}" \
              SMTP_USER="${{ secrets.SMTP_USER }}" \
              SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" \
              SMTP_FROM_EMAIL="${{ secrets.SMTP_FROM_EMAIL }}" \
              SMTP_USE_TLS=true \
              OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              IMAGE_OPEN_API_KEY="${{ secrets.IMAGE_OPEN_API_KEY }}" \
              IMAGE_PROCESSING_MODEL="${{ secrets.IMAGE_PROCESSING_MODEL }}" \
              HF_TOKEN="${{ secrets.HF_TOKEN }}" \
              EMBEDDING_MODEL="${{ vars.EMBEDDING_MODEL }}" \
              MAX_UPLOAD_SIZE_MB="${{ vars.MAX_UPLOAD_SIZE_MB }}" \
              UPLOAD_DIR=uploads \
              ALLOWED_ORIGINS="${{ vars.ALLOWED_ORIGINS }}"

      # ── Deploy to Azure App Service ─────────────────────────────────────────
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          images: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest'

      # ── Smoke Test ──────────────────────────────────────────────────────────
      - name: Smoke test — verify live health endpoint
        run: |
          echo "Waiting for App Service to start (up to 5 min)..."
          MAX_RETRIES=20
          SLEEP_SECONDS=15
          HEALTH_URL="${{ env.LIVE_URL }}/api/v1/health"

          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 --max-time 20 "$HEALTH_URL" || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed (HTTP $HTTP_STATUS) on attempt $i"
              exit 0
            else
              echo "  Attempt $i/$MAX_RETRIES — HTTP $HTTP_STATUS, retrying in ${SLEEP_SECONDS}s..."
              sleep $SLEEP_SECONDS
            fi
          done

          echo "Smoke test FAILED — $HEALTH_URL did not return 200 after $MAX_RETRIES attempts"
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "## Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Live URL** | ${{ env.LIVE_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | sha-${SHORT_SHA} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
